server {
    listen 80;
    server_name skills.outlayer.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name skills.outlayer.ai;

    ssl_certificate /etc/ssl/outlayer.ai.pem;
    ssl_certificate_key /etc/ssl/outlayer.ai.key;

    root /home/nextjs-user/code/skills/web-ui/public;
    index index.html;

    include mime.types;
    types {
        text/plain md;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No directory listings: a skill directory URL goes to its SKILL.md
    autoindex off;
    location ~ ^/([^/]+)/$ {
        return 302 /$1/SKILL.md;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Case-insensitive SKILL.md access
    location ~ ^/([^/]+)/skill\.md$ {
        set $skill $1;
        try_files /$skill/skill.md /$skill/SKILL.md =404;
    }

    location / {
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
